<svg width="64" height="64" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
    <defs>
        <!-- Main gradient background -->
        <linearGradient id="mainGradient" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
            <stop offset="100%" style="stop-color:#764ba2;stop-opacity:1" />
        </linearGradient>
        <!-- Gradient for accent elements (AI & Chat) -->
        <linearGradient id="accentGradient" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" style="stop-color:#fda085;stop-opacity:1" />
            <stop offset="100%" style="stop-color:#f6d365;stop-opacity:1" />
        </linearGradient>
        <!-- Zotero red for book element -->
        <linearGradient id="bookGradient" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" style="stop-color:#cc2936;stop-opacity:1" />
            <stop offset="100%" style="stop-color:#a82f2f;stop-opacity:1" />
        </linearGradient>
        <!-- Shadow filter -->
        <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
            <feDropShadow dx="0" dy="2" stdDeviation="2" flood-opacity="0.3" />
        </filter>
    </defs>

    <!-- Main background circle -->
    <circle cx="32" cy="32" r="32" fill="url(#mainGradient)" />

    <!-- Central Book Icon (Zotero element) -->
    <g>
        <!-- Book left page -->
        <path d="M 18 16 Q 22 14 26 14 L 26 50 Q 22 52 18 50 Z" fill="url(#bookGradient)"
            opacity="0.9" />
        <!-- Book right page -->
        <path d="M 26 14 L 38 12 Q 42 12 46 14 L 46 50 Q 42 52 38 52 L 26 50 Z"
            fill="url(#bookGradient)" />

        <!-- Book spine highlight -->
        <rect x="25" y="14" width="2" height="36" fill="rgba(255,255,255,0.3)" />

        <!-- Pages detail lines -->
        <line x1="22" y1="22" x2="40" y2="22" stroke="rgba(255,255,255,0.4)" stroke-width="1.5" />
        <line x1="22" y1="28" x2="40" y2="28" stroke="rgba(255,255,255,0.35)" stroke-width="1.5" />
        <line x1="22" y1="34" x2="40" y2="34" stroke="rgba(255,255,255,0.3)" stroke-width="1.5" />
        <line x1="22" y1="40" x2="36" y2="40" stroke="rgba(255,255,255,0.25)" stroke-width="1.5" />
    </g>

    <!-- AI Element - Lightning Bolt (Top Right) -->
    <g filter="url(#shadow)">
        <!-- Lightning bolt -->
        <path d="M 50 4 L 46 14 L 52 14 L 48 26 L 56 10 L 50 10 Z"
            fill="url(#accentGradient)" />
        <!-- Glow circle behind lightning -->
        <circle cx="50" cy="12" r="12" fill="rgba(253, 160, 133, 0.15)" />
    </g>

    <!-- Chat Element - Speech Bubble (Bottom) -->
    <g filter="url(#shadow)">
        <!-- Main bubble -->
        <path
            d="M 32 42 Q 28 42 26 46 Q 26 52 32 52 L 44 52 Q 50 52 50 46 Q 50 42 44 42 Z M 32 52 L 28 56 L 32 52 Z"
            fill="url(#accentGradient)" />

        <!-- Chat dots (message indicator) -->
        <circle cx="33" cy="47" r="1.5" fill="rgba(255,255,255,0.9)" />
        <circle cx="38" cy="47" r="1.5" fill="rgba(255,255,255,0.9)" />
        <circle cx="43" cy="47" r="1.5" fill="rgba(255,255,255,0.9)" />
    </g>

    <!-- Zotero badge (Left corner) -->
    <g filter="url(#shadow)">
        <circle cx="14" cy="14" r="7" fill="rgba(255, 255, 255, 0.95)" />
        <text x="14" y="17" font-size="7" font-weight="900" fill="#cc2936" text-anchor="middle"
            font-family="Arial, sans-serif, -apple-system">Z</text>
    </g>

    <!-- Decorative elements connecting structure -->
    <circle cx="32" cy="32" r="30" fill="none" stroke="rgba(255,255,255,0.05)" stroke-width="1" />

    <!-- Top shine/highlight effect -->
    <ellipse cx="32" cy="14" rx="18" ry="6" fill="rgba(255,255,255,0.12)" />

    <!-- Element names (visible in larger sizes, hidden in small) -->
    <g opacity="0.4" font-size="4" fill="white" text-anchor="middle" font-family="Arial, sans-serif">
        <text x="50" y="6">AI</text>
        <text x="38" y="58">CHAT</text>
    </g>
</svg>
